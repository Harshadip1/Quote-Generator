<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Quote - InspireHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="particles" id="particles"></div>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="top-header">
        <button class="menu-toggle" id="menu-toggle" aria-label="Menu">☰</button>
        <div class="search-bar">
          <span class="search-icon">🔍</span>
          <input type="text" id="global-search" placeholder="Search quotes, authors, categories...">
        </div>
        <div class="header-actions">
          <a href="notifications.html" class="icon-btn notifications-btn">🔔<span class="badge-dot"></span></a>
          <a href="favorites.html" class="icon-btn">❤️</a>
          <a href="settings.html" class="icon-btn">⚙️</a>
        </div>
      </header>
      <div class="page-container">
        <div class="page-header reveal">
          <h1 class="page-title">☀️ Daily Quote</h1>
          <p class="page-subtitle">Your daily dose of inspiration — refreshes at midnight</p>
        </div>
        <div class="daily-quote-card reveal" id="daily-quote-section">
          <p class="quote-text" id="daily-quote-text"></p>
          <p class="quote-author" id="daily-quote-author"></p>
          <div class="quote-tags" id="daily-quote-tags"></div>
        </div>
        <div class="flex flex-wrap gap-1 mt-2" style="justify-content:center">
          <button class="btn btn-primary" id="new-quote-btn">🔄 New Quote</button>
          <button class="btn btn-secondary" id="save-daily-btn">❤️ Save Quote</button>
          <a href="share.html" class="btn btn-secondary">📤 Share</a>
        </div>
        <div class="glass-card text-center mt-3 reveal">
          <p class="text-muted">Next quote in</p>
          <div class="timer-display" id="quote-timer" style="font-size:2rem">00:00:00</div>
        </div>
      </div>
    </main>
  </div>
  <script src="js/quotes.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
