<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - InspireHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="particles" id="particles"></div>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="top-header">
        <button class="menu-toggle" id="menu-toggle" aria-label="Menu">☰</button>
        <div class="search-bar">
          <span class="search-icon">🔍</span>
          <input type="text" id="global-search" placeholder="Search quotes, authors, categories...">
        </div>
        <div class="header-actions">
          <a href="notifications.html" class="icon-btn notifications-btn">🔔<span class="badge-dot"></span></a>
          <a href="favorites.html" class="icon-btn">❤️</a>
          <a href="settings.html" class="icon-btn">⚙️</a>
        </div>
      </header>
      <div class="page-container">
        <div class="profile-header reveal">
          <div class="profile-avatar">✦</div>
          <div>
            <h1>Inspiration Seeker</h1>
            <p class="text-muted">Member since 2024 · Premium Explorer</p>
            <div class="stats-grid mt-2" style="grid-template-columns:repeat(3,1fr)">
              <div><strong id="profile-fav-count">0</strong><br><small class="text-muted">Favorites</small></div>
              <div><strong id="profile-streak">0</strong><br><small class="text-muted">Day Streak</small></div>
              <div><strong id="profile-read-count">0</strong><br><small class="text-muted">Quotes Read</small></div>
            </div>
          </div>
        </div>
        <h2 class="section-title mb-2 reveal">🏆 Achievements</h2>
        <div class="achievements-grid" id="achievements-grid"></div>
        <section class="mt-3 reveal">
          <h2 class="section-title mb-2">📝 Mini Journal</h2>
          <div class="glass-card">
            <textarea class="form-textarea" placeholder="Write your thoughts today..."></textarea>
            <button class="btn btn-primary btn-sm mt-2">Save Entry</button>
          </div>
        </section>
        <section class="mt-3 reveal">
          <h2 class="section-title mb-2">🧘 Meditation Timer</h2>
          <div class="glass-card text-center">
            <div class="timer-display" id="meditation-timer">05:00</div>
            <div class="flex gap-1" style="justify-content:center">
              <button class="btn btn-primary btn-sm" onclick="showToast('Timer started', '⏱️')">Start</button>
              <button class="btn btn-secondary btn-sm">Reset</button>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="js/quotes.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
