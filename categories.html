<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories - InspireHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="particles" id="particles"></div>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="top-header">
        <button class="menu-toggle" id="menu-toggle" aria-label="Menu">☰</button>
        <div class="search-bar">
          <span class="search-icon">🔍</span>
          <input type="text" id="global-search" placeholder="Search quotes, authors, categories...">
        </div>
        <div class="header-actions">
          <a href="notifications.html" class="icon-btn notifications-btn">🔔<span class="badge-dot"></span></a>
          <a href="favorites.html" class="icon-btn">❤️</a>
          <a href="settings.html" class="icon-btn">⚙️</a>
        </div>
      </header>
      <div class="page-container">
        <div class="page-header reveal">
          <h1 class="page-title">📂 Quote Categories</h1>
          <p class="page-subtitle">Browse quotes by topic — 12 categories with hundreds of quotes</p>
        </div>
        <div class="categories-grid" id="all-categories"></div>
      </div>
    </main>
  </div>
  <script src="js/quotes.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
