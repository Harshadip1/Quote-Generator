<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Quotes Player - InspireHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="particles" id="particles"></div>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="top-header">
        <button class="menu-toggle" id="menu-toggle" aria-label="Menu">☰</button>
        <div class="search-bar">
          <span class="search-icon">🔍</span>
          <input type="text" id="global-search" placeholder="Search quotes, authors, categories...">
        </div>
        <div class="header-actions">
          <a href="notifications.html" class="icon-btn notifications-btn">🔔<span class="badge-dot"></span></a>
          <a href="favorites.html" class="icon-btn">❤️</a>
          <a href="settings.html" class="icon-btn">⚙️</a>
        </div>
      </header>
      <div class="page-container">
        <div class="page-header reveal">
          <h1 class="page-title">🎧 Audio Quotes</h1>
          <p class="page-subtitle">Listen to inspirational quotes on the go</p>
        </div>
        <div class="audio-player reveal">
          <h3 id="current-track-title">Morning Motivation</h3>
          <p class="text-muted" id="current-track-duration">3:24</p>
          <div class="visualizer" id="audio-visualizer">
            <div class="visualizer-bar"></div><div class="visualizer-bar"></div><div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div><div class="visualizer-bar"></div><div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div><div class="visualizer-bar"></div>
          </div>
          <div class="progress-bar mb-3"><div class="progress-fill" id="audio-progress" style="width:0%"></div></div>
          <div class="flex gap-1" style="justify-content:center;align-items:center">
            <button class="icon-btn" id="audio-prev">⏮️</button>
            <button class="btn btn-primary" id="audio-play-btn" style="width:64px;height:64px;border-radius:50%;font-size:1.5rem">▶️</button>
            <button class="icon-btn" id="audio-next">⏭️</button>
          </div>
        </div>
        <h2 class="section-title mt-3 mb-2 reveal">🎵 Playlist</h2>
        <div class="playlist-grid" id="audio-playlist"></div>
        <h2 class="section-title mt-3 mb-2 reveal">⭐ Featured</h2>
        <div class="grid-3" id="featured-audio"></div>
      </div>
    </main>
  </div>
  <script src="js/quotes.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>
  <script src="js/audio.js"></script>
</body>
</html>
