<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallpaper Creator - InspireHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="particles" id="particles"></div>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="top-header">
        <button class="menu-toggle" id="menu-toggle" aria-label="Menu">☰</button>
        <div class="search-bar">
          <span class="search-icon">🔍</span>
          <input type="text" id="global-search" placeholder="Search quotes, authors, categories...">
        </div>
        <div class="header-actions">
          <a href="notifications.html" class="icon-btn notifications-btn">🔔<span class="badge-dot"></span></a>
          <a href="favorites.html" class="icon-btn">❤️</a>
          <a href="settings.html" class="icon-btn">⚙️</a>
        </div>
      </header>
      <div class="page-container">
        <div class="page-header reveal">
          <h1 class="page-title">🖼️ Quote Wallpaper Creator</h1>
          <p class="page-subtitle">Design beautiful quote wallpapers for your device</p>
        </div>
        <div class="wallpaper-editor reveal">
          <div class="wallpaper-preview" id="wallpaper-preview"></div>
          <div class="wallpaper-controls glass-card">
            <div class="form-group">
              <label class="form-label">Quote Text</label>
              <textarea class="form-textarea" id="wallpaper-quote" rows="3"></textarea>
            </div>
            <div class="form-group">
              <label class="form-label">Author</label>
              <input class="form-input" id="wallpaper-author" type="text">
            </div>
            <div class="form-group">
              <label class="form-label">Font Size: <span id="font-size-value">24px</span></label>
              <input type="range" id="wallpaper-font-size" min="16" max="48" value="24" class="form-input">
            </div>
            <div class="form-group">
              <label class="form-label">Background</label>
              <div class="color-picker-row" id="gradient-colors"></div>
            </div>
            <div class="form-group">
              <label class="form-label">Font Style</label>
              <div class="tabs" id="font-options"></div>
            </div>
            <button class="btn btn-secondary" id="random-wallpaper-quote">🎲 Random Quote</button>
            <button class="btn btn-primary" id="download-wallpaper">⬇️ Download Wallpaper</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="js/quotes.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>
  <script src="js/wallpaper.js"></script>
</body>
</html>
