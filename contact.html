<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - InspireHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="particles" id="particles"></div>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="top-header">
        <button class="menu-toggle" id="menu-toggle" aria-label="Menu">☰</button>
        <div class="search-bar">
          <span class="search-icon">🔍</span>
          <input type="text" id="global-search" placeholder="Search quotes, authors, categories...">
        </div>
        <div class="header-actions">
          <a href="notifications.html" class="icon-btn notifications-btn">🔔<span class="badge-dot"></span></a>
          <a href="favorites.html" class="icon-btn">❤️</a>
          <a href="settings.html" class="icon-btn">⚙️</a>
        </div>
      </header>
      <div class="page-container">
        <div class="page-header reveal">
          <h1 class="page-title">📧 Contact Us</h1>
          <p class="page-subtitle">We'd love to hear from you</p>
        </div>
        <div class="two-col">
          <form class="glass-card reveal" onsubmit="event.preventDefault();showToast('Message sent (demo)','✅')">
            <div class="form-group"><label class="form-label">Name</label><input class="form-input" type="text" placeholder="Your name" required></div>
            <div class="form-group"><label class="form-label">Email</label><input class="form-input" type="email" placeholder="you@example.com" required></div>
            <div class="form-group"><label class="form-label">Message</label><textarea class="form-textarea" placeholder="How can we help?" required></textarea></div>
            <button type="submit" class="btn btn-primary">Send Message</button>
          </form>
          <div class="glass-card reveal">
            <h3 class="mb-2">📍 Get in Touch</h3>
            <p class="text-muted mb-2">support@inspirehub.demo</p>
            <p class="text-muted mb-2">Mon–Fri, 9am–6pm</p>
            <p class="text-muted">Response within 24 hours</p>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="js/quotes.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
